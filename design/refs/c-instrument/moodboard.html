e. Borrowed: the field book&#x27;s ruled columns (station, bearing, distance) for the fiche.</figcaption></figure><figure><img src="uscgs-e134-jpg.jpg"><figcaption>Benchmark E 134 (1947): &#x27;ELEV FEET&#x27;, &#x27;$250 fine or imprisonment for disturbing this mark&#x27;. Borrowed: the record states what the point is, plainly, in stamped type.</figcaption></figure></main></html>

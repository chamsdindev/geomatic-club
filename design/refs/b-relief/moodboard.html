<!doctype html><html lang="fr"><meta charset=utf-8><title>B, Le relief: references</title><style>body{margin:0;font:13px/1.4 system-ui;background:#fff;color:#111;width:1280px}h1{font-size:18px;margin:14px 10px 4px}main{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}figure{margin:0}img{width:100%;height:200px;object-fit:cover;display:block}figcaption{padding:4px 0}</style><h1>B, Le relief: references</h1><main><figure><img src="carte-arch-ologique-et-topographique-des-ruines-de-carthage.jpg"><figcaption>Carthage 1895: the title set in widely spaced engraved capitals, a dotted coastline, hairline graticule ticks in the margin. Borrowed: dotted shoreline and margin ticks.</figcaption></figure><figure><img src="schulkarte-der-schweiz-prof-ed-imhof-btv1b531983954-jpg.jpg"><figcaption>Imhof&#x27;s school map: lit slopes warm, shadows cool blue-grey (aerial perspective). Borrowed: shadow tone #8E9AA8 in hillshade, never grey.</figcaption></figure><figure><img src="swisstopo-000-410-909-neue-landeskarte-erstellung-relief-tif.jpg"><figcaption>A swisstopo cartographer painting the relief by hand on a tilted desk. Borrowed: the north-west light at 315° and the idea of the map as a made object.</figcaption></figure><figure><img src="usgs-topographic-map-michigan-wyandotte-quadrangle-278613-19.jpg"><figcaption>USGS quad: brown index contours with their value set in the line, blue water lining along the shore. Borrowed: water lining (3 parallel lines along the coast) and labels set inside contour gaps.</figcaption></figure><figure><img src="zion-np-shaded-relief-png.png"><figcaption>Same terrain lit three ways (NW, NW + vertical, 32 lights). Borrowed: multi-directional hillshade so no slope goes black.</figcaption></figure></main></html>

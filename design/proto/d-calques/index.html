<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geomatic Club, les calques</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root{--table:#EEF1F3;--noir:#000;--bistre:#8A4F27;--hydro:#1F6FB2;--vert:#BBD99B;--gris:#5A6068;--film:rgba(255,255,255,.22)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--table);color:var(--noir);font-family:"Overpass",sans-serif;min-height:100dvh;overflow-x:hidden}
.page{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px max(12px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:baseline;height:30px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.015em}
.sheet{font-size:13px;color:var(--gris)}
/* The light table and the stack of plates */
.stage{position:relative;height:392px;margin:4px -18px 0;perspective:1100px;perspective-origin:50% 40%;overflow:hidden}
.tilt{position:absolute;inset:0;transform-style:preserve-3d}
.stack{position:absolute;left:50%;top:50%;width:270px;height:270px;margin:-135px 0 0 -135px;transform-style:preserve-3d}
.plate{position:absolute;inset:0;background:var(--film);outline:1.5px solid rgba(0,0,0,.4);transform-style:preserve-3d}
.plate.ghost{outline:1px dashed rgba(0,0,0,.35)}
.plate canvas,.plate svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tab{position:absolute;left:0;top:-20px;height:20px;padding:0 7px;font-size:11px;font-weight:600;background:#fff;outline:1px solid rgba(0,0,0,.28);display:flex;align-items:center;gap:5px;white-space:nowrap}
.tab i{width:9px;height:9px;display:inline-block}
.reg{position:absolute;width:18px;height:18px}
/* The legend is the form */
form{display:grid;gap:2px;margin-top:6px}
.row{display:grid;grid-template-columns:36px 1fr 22px;align-items:center;column-gap:10px;padding:5px 0;border-bottom:1px solid #C9CED3}
.sw{width:36px;height:36px;outline:1px solid rgba(0,0,0,.3);background:#fff}
.row label{display:block;font-size:13px;font-weight:600;color:var(--gris);line-height:1.1}
.row input{display:block;width:100%;border:0;background:transparent;font:500 18px "Overpass",sans-serif;color:var(--noir);height:30px;outline:none;padding:0}
.row .pick{position:relative;height:30px;display:flex;align-items:center;font-size:18px;font-weight:500}
.row .pick input{position:absolute;inset:0;opacity:0;cursor:pointer;height:30px}
.row .pick output:empty::before{content:"Choisir";color:#8A9097}
.row:focus-within{border-bottom:2px solid var(--hydro)}
.chk{width:20px;height:20px;outline:1.5px solid #000;display:grid;place-items:center}
.chk svg{width:14px;height:14px}
.err{grid-column:2 / 4;font-size:13px;color:#000;min-height:0}
.err:not(:empty){padding-top:2px}
.err:not(:empty)::before{content:"";display:inline-block;width:8px;height:8px;background:#C2410C;margin-right:6px}
.send{margin-top:12px;height:54px;border:0;border-radius:3px;background:#000;color:#fff;font:800 18px "Overpass",sans-serif;cursor:pointer}
.send:focus-visible{outline:3px solid var(--hydro);outline-offset:3px}
.status{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;font-size:12px;color:var(--gris);font-variant-numeric:tabular-nums}
/* Success: the attribute table */
.sheetup{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #000;padding:18px 18px max(14px,env(safe-area-inset-bottom));visibility:hidden;max-height:62dvh;overflow:auto}
.sheetup .in{max-width:394px;margin:0 auto}
.sheetup h1{font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.02em}
.sheetup p{margin-top:8px;font-size:15px;line-height:1.45}
.attr{margin-top:12px;width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.attr caption{text-align:left;font-size:12px;color:var(--gris);padding-bottom:4px}
.attr th{text-align:left;font-weight:600;color:var(--gris);border:1px solid #C9CED3;padding:4px 6px;background:#F5F7F8;width:84px}
.attr td{border:1px solid #C9CED3;padding:4px 6px}
.acts{display:grid;gap:8px;margin-top:14px}
.acts .send{margin:0}
.ghostb{height:48px;border:2px solid #000;border-radius:3px;background:#fff;font:800 16px "Overpass",sans-serif;cursor:pointer}
.again{background:none;border:0;font:14px "Overpass",sans-serif;text-decoration:underline;text-underline-offset:3px;padding:6px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="page">
  <header><span class="brand">Geomatic Club</span><span class="sheet">Feuille Tunis 1:25 000</span></header>
  <div class="stage" id="stage" aria-hidden="true"><div class="tilt" id="tilt"><div class="stack" id="stack"></div></div></div>
  <form id="form" novalidate>
    <div class="row" data-k="0"><span class="sw" id="sw0"></span><div><label for="prenom">Prénom</label><input id="prenom" autocomplete="given-name" enterkeyhint="next" aria-describedby="prenom-err"></div><span class="chk"></span><p class="err" id="prenom-err" aria-live="polite"></p></div>
    <div class="row" data-k="1"><span class="sw" id="sw1"></span><div><label for="nom">Nom</label><input id="nom" autocomplete="family-name" enterkeyhint="next" aria-describedby="nom-err"></div><span class="chk"></span><p class="err" id="nom-err" aria-live="polite"></p></div>
    <div class="row" data-k="2"><span class="sw" id="sw2"></span><div><label for="date">Date</label><div class="pick"><output id="date-out"></output><input id="date" type="date" aria-describedby="date-err"></div></div><span class="chk"></span><p class="err" id="date-err" aria-live="polite"></p></div>
    <div class="row" data-k="3"><span class="sw" id="sw3"></span><div><label for="heure">Heure</label><div class="pick"><output id="heure-out"></output><input id="heure" type="time" min="08:00" max="18:00" step="1800" aria-describedby="heure-err"></div></div><span class="chk"></span><p class="err" id="heure-err" aria-live="polite"></p></div>
    <p class="sr" id="progress" aria-live="polite"></p>
    <button class="send" id="envoyer" type="submit">Envoyer</button>
  </form>
  <div class="status"><span>EPSG:4326</span><span>1:25 000</span><span id="xy">36,8065° N  10,1815° E</span></div>
</div>

<section class="sheetup" id="sheet" aria-live="polite"><div class="in">
  <h1 id="s-title"></h1><p id="s-text"></p>
  <table class="attr"><caption>Table attributaire, membres</caption><tbody id="s-attr"></tbody></table>
  <div class="acts"><button class="send" type="button">Enregistrer ma carte</button><button class="ghostb" type="button">Partager</button><button class="again" type="button" onclick="location.reload()">Nouvelle inscription</button></div>
</div></section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script src="../common.js"></script>
<script>
gsap.registerPlugin(SplitText, DrawSVGPlugin);
const $ = (s, r = document) => r.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const S = 270; // plate size in CSS px

// ---- One terrain for all plates: the coast of the gulf to the north-east
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function vn(x, y) { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy); const a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y) { let t = 0, a = .5; for (let i = 0; i < 5; i++) { t += a * vn(x, y); x *= 2.03; y *= 2.03; a *= .5; } return t; }
const H = (x, y) => fbm(x / 95 + 3, y / 95 + 7) * .9 + (0.62 - (x * 0.7 + (S - y) * 0.9) / (S * 1.6)) * 0.75;
const SEA = 0.34;
const N = 90, step = S / N; const grid = []; for (let j = 0; j <= N; j++) { grid.push([]); for (let i = 0; i <= N; i++) grid[j].push(H(i * step, j * step)); }
function iso(level) { // marching squares, segments only
  let d = ""; const L = (a, b) => (level - a) / (b - a);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const tl = grid[j][i], tr = grid[j][i + 1], br = grid[j + 1][i + 1], bl = grid[j + 1][i];
    const c = (tl > level ? 8 : 0) | (tr > level ? 4 : 0) | (br > level ? 2 : 0) | (bl > level ? 1 : 0); if (!c || c === 15) continue;
    const x = i * step, y = j * step, T = [x + L(tl, tr) * step, y], Rr = [x + step, y + L(tr, br) * step], B = [x + L(bl, br) * step, y + step], Lf = [x, y + L(tl, bl) * step];
    const P = { 1: [Lf, B], 2: [B, Rr], 3: [Lf, Rr], 4: [T, Rr], 5: [Lf, T, B, Rr], 6: [T, B], 7: [Lf, T], 8: [Lf, T], 9: [T, B], 10: [T, Rr, Lf, B], 11: [T, Rr], 12: [Lf, Rr], 13: [B, Rr], 14: [Lf, B] }[c];
    for (let k = 0; k < P.length; k += 2) d += `M${P[k][0].toFixed(1)} ${P[k][1].toFixed(1)}L${P[k + 1][0].toFixed(1)} ${P[k + 1][1].toFixed(1)}`;
  }
  return d;
}
const svg = (html) => `<svg viewBox="0 0 ${S} ${S}" xmlns="${NS}">${html}</svg>`;
const reg = (c) => `<g stroke="${c}" stroke-width="1" fill="none">${[[10, 10], [S - 10, 10], [10, S - 10], [S - 10, S - 10]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5"/><path d="M${x - 9} ${y}H${x + 9}M${x} ${y - 9}V${y + 9}"/>`).join("")}</g>`;

// Fond: woodland tint over a multi-directional hillshade, shadows cool (Imhof)
function fond() {
  const c = document.createElement("canvas"); c.width = c.height = S * 2; const g = c.getContext("2d"); const im = g.createImageData(S * 2, S * 2);
  for (let y = 0; y < S * 2; y++) for (let x = 0; x < S * 2; x++) {
    const h = H(x / 2, y / 2), hx = H(x / 2 + 1, y / 2) - h, hy = H(x / 2, y / 2 + 1) - h;
    const lit = Math.max(-1, Math.min(1, (-hx * -0.7 - hy * -0.7) * 60)) * 0.5 + Math.max(-1, Math.min(1, -(hx + hy) * 25)) * 0.2;
    let r = 244, gg = 245, b = 241;
    if (h < SEA) { r = 214; gg = 230; b = 241; } else {
      const wood = fbm(x / 70 + 40, y / 70) > 0.52;
      if (wood) { r = 187; gg = 217; b = 155; }
      const s = lit < 0 ? -lit : 0, l = lit > 0 ? lit : 0;
      r = r * (1 - s * .45) + 142 * s * .45 + l * 10; gg = gg * (1 - s * .45) + 154 * s * .45 + l * 8; b = b * (1 - s * .45) + 168 * s * .45;
    }
    const i = (y * S * 2 + x) * 4; im.data[i] = r; im.data[i + 1] = gg; im.data[i + 2] = b; im.data[i + 3] = 235;
  }
  g.putImageData(im, 0, 0); return c;
}
function courbes() {
  let p = ""; for (let k = 1; k < 30; k++) { const lv = SEA + k * 0.025; const idx = k % 4 === 0; p += `<path d="${iso(lv)}" fill="none" stroke="#8A4F27" stroke-width="${idx ? 1.3 : .6}" opacity="${idx ? 1 : .85}"/>`; }
  return svg(p + `<g font-family="Overpass" font-size="8" fill="#8A4F27" font-weight="600" paint-order="stroke" stroke="#F4F5F1" stroke-width="3"><text x="62" y="118">100</text><text x="40" y="58">150</text><text x="150" y="200">50</text></g>` + reg("#8A4F27"));
}
function hydro() {
  let p = `<path d="${iso(SEA)}" fill="none" stroke="#1F6FB2" stroke-width="1.4"/>`;
  [0.018, 0.04, 0.068].forEach((o, k) => (p += `<path d="${iso(SEA - o)}" fill="none" stroke="#1F6FB2" stroke-width=".6" opacity="${0.8 - k * 0.22}"/>`));
  p += `<path d="M70 20C80 60 66 90 92 120S120 160 150 176" fill="none" stroke="#1F6FB2" stroke-width=".9" stroke-dasharray="5 2 1 2"/>`;
  p += `<text x="168" y="70" font-family="Newsreader" font-style="italic" font-size="14" fill="#1F6FB2" transform="rotate(-22 168 70)">Golfe de Tunis</text>`;
  return svg(p + reg("#1F6FB2"));
}
function ecritures() {
  let g = "";
  for (let x = 45; x < S; x += 45) for (let y = 45; y < S; y += 45) g += `<path d="M${x - 4} ${y}H${x + 4}M${x} ${y - 4}V${y + 4}" stroke="#000" stroke-width=".7"/>`;
  g += `<g font-family="Overpass" fill="#000"><text x="96" y="66" font-size="10" font-weight="600">La Marsa</text><text x="118" y="150" font-size="10" font-weight="600">Sidi Bou Saïd</text><text x="66" y="208" font-size="10" font-weight="600">Carthage</text></g>`;
  g += `<g id="me"><circle cx="150" cy="104" r="3.4" fill="#000"/><circle cx="150" cy="104" r="7" fill="none" stroke="#000" stroke-width="1"/><text id="me-label" x="160" y="100" font-family="Overpass" font-weight="800" font-size="12" fill="#000" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"></text></g>`;
  return svg(g + reg("#000"));
}

// ---- Build the stack
const PLATES = [
  { name: "Fond", sw: "#BBD99B", make: () => fond() },
  { name: "Courbes", sw: "#8A4F27", make: courbes },
  { name: "Hydrographie", sw: "#1F6FB2", make: hydro },
  { name: "Écritures", sw: "#000", make: ecritures },
];
const GAP = 64;
const plates = PLATES.map((P, k) => {
  const el = document.createElement("div"); el.className = "plate ghost";
  const body = P.make(); if (typeof body === "string") el.innerHTML = body; else el.appendChild(body);
  el.insertAdjacentHTML("beforeend", `<span class="tab"><i style="background:${P.sw}"></i>${P.name}</span>`);
  $("#stack").appendChild(el);
  const sw = $(`#sw${k}`); sw.style.background = k === 0 ? P.sw : "#fff";
  if (k === 1) sw.innerHTML = `<svg viewBox="0 0 36 36"><path d="M2 26C10 18 18 30 34 14M2 32C12 24 22 34 34 24" fill="none" stroke="#8A4F27" stroke-width="1.4"/></svg>`;
  if (k === 2) sw.innerHTML = `<svg viewBox="0 0 36 36"><path d="M2 12C12 8 22 16 34 10M2 18C12 14 22 22 34 16M2 24C12 20 22 28 34 22" fill="none" stroke="#1F6FB2" stroke-width="1.2"/></svg>`;
  if (k === 3) sw.innerHTML = `<svg viewBox="0 0 36 36"><text x="18" y="24" text-anchor="middle" font-family="Overpass" font-weight="800" font-size="15">Aa</text></svg>`;
  return el;
});
// Off register: each unregistered plate sits a little askew, as in a misprint
const OFF = [[16, -12, 2.2], [-14, 10, -1.8], [12, 14, 1.6], [-16, -10, -2.4]];
gsap.set("#stack", { rotationX: 56, rotationZ: -36, scale: .72, x: 48, y: 8 });
plates.forEach((p, k) => gsap.set(p, { z: k * GAP, x: OFF[k][0], y: OFF[k][1], rotation: OFF[k][2], opacity: .5 }));
const meLabel = $("#me-label");

// ---- Tilt with the phone, or the pointer
const tx = gsap.quickTo("#tilt", "rotationY", { duration: .6, ease: "power3.out" }), ty = gsap.quickTo("#tilt", "rotationX", { duration: .6, ease: "power3.out" });
const lim = gsap.utils.clamp(-9, 9);
addEventListener("deviceorientation", (e) => { if (e.gamma != null) { tx(lim(e.gamma / 3)); ty(lim(-(e.beta - 40) / 3)); } });
addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") { tx(lim((e.clientX / innerWidth - .5) * 18)); ty(lim(-(e.clientY / innerHeight - .5) * 14)); } });

// ---- Intro (1.8 s): the plates come down onto the light table, the registration marks draw
const reduce = GC.reduced();
const intro = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
intro.addLabel("plates", 0)
  .from(plates, { z: (k) => k * GAP + 260, opacity: 0, duration: .9, stagger: .12 }, "plates")
  .from(".plate .tab", { opacity: 0, duration: .3, stagger: .12 }, "plates+=.5")
  .addLabel("marks", .7)
  .from(".plate circle, .plate g[stroke] path", { drawSVG: 0, duration: .6, stagger: { each: .004 } }, "marks")
  .addLabel("legend", 1.1)
  .from(".row", { opacity: 0, duration: .4, stagger: .07 }, "legend")
  .from(".send, .status", { opacity: 0, duration: .4 }, "legend+=.3");
GC.skippable(intro);
document.fonts.ready.then(() => (reduce ? intro.progress(1) : intro.play()));

// ---- The form registers the plates; the names plate letters the name as it's typed
const check = `<svg viewBox="0 0 14 14"><path d="M2 7.5 5.5 11 12 3" fill="none" stroke="#000" stroke-width="2"/></svg>`;
function letterName() { const t = `${$("#prenom").value.trim()} ${$("#nom").value.trim()}`.trim(); meLabel.textContent = t; }
["prenom", "nom"].forEach((id) => $(`#${id}`).addEventListener("input", letterName));
$("#date").addEventListener("input", (e) => ($("#date-out").textContent = e.target.value ? `${GC.fmtDateShort(e.target.value)} ${e.target.value.slice(0, 4)}` : ""));
$("#heure").addEventListener("input", (e) => ($("#heure-out").textContent = GC.fmtTime(e.target.value)));
const form = GC.wireForm({
  form: $("#form"),
  onState(id, ok, msg, k) {
    const p = plates[k]; p.classList.toggle("ghost", !ok);
    gsap.to(p, ok ? { x: 0, y: 0, rotation: 0, opacity: 1, duration: .55, ease: "back.out(2.2)" } : { x: OFF[k][0], y: OFF[k][1], rotation: OFF[k][2], opacity: .5, duration: .4, ease: "power2.out" });
    // In register: the plate's registration marks flash red for a moment, as on a press proof
    if (ok && !reduce) { const marks = p.querySelectorAll("svg > g[stroke]"); gsap.fromTo(marks, { stroke: "#C2410C", strokeWidth: 2.4 }, { stroke: (i, el) => el.getAttribute("stroke"), strokeWidth: 1, duration: .7, delay: .35, ease: "power2.out" }); }
    if (ok) gsap.fromTo(p, { z: k * GAP + 22 }, { z: k * GAP, duration: .5, ease: "power2.in" });
    const box = $(`.row[data-k="${k}"] .chk`); box.innerHTML = ok ? check : ""; if (ok && !reduce) gsap.from(box.firstChild, { drawSVG: 0, duration: .3 });
    $("#progress").textContent = `${form ? form.valid() : 0} calques sur 4 en repérage`;
  },
  onSubmit: success,
});

// ---- Success: the plates fall into register and lie flat; the point and its label; the attribute table
function success(d) {
  const p = GC.point(d.prenom, d.nom, d.date);
  $("#s-title").textContent = `Bienvenue sur la carte, ${d.prenom}.`;
  $("#s-text").textContent = `Ton point est fixé. Le ${GC.fmtDate(d.date)} à ${GC.fmtTime(d.heure)}, on t'attend ; c'est ${GC.countdown(d.date, d.heure)}.`;
  const rows = [["prenom", d.prenom], ["nom", d.nom], ["date", d.date.split("-").reverse().join("/")], ["heure", d.heure], ["x", p.lon.toFixed(5)], ["y", p.lat.toFixed(5)], ["ref", p.ref]];
  $("#s-attr").innerHTML = rows.map(([k, v]) => `<tr><th scope="row">${k}</th><td>${v}</td></tr>`).join("");
  $("#xy").textContent = `${GC.fmtLat(p.lat)}  ${GC.fmtLon(p.lon)}`;
  navigator.vibrate?.([12, 60, 24]);
  meLabel.textContent = `${d.prenom} ${d.nom}`;
  const tl = gsap.timeline({ defaults: { ease: "power3.inOut" } });
  tl.addLabel("hold", 0)
    .to("#tilt", { rotationX: 0, rotationY: 0, duration: .3, ease: "power2.out" }, "hold")
    .to("body", { backgroundColor: "#E2E6E9", duration: .3 }, "hold")
    .addLabel("register", .4)
    .to("#form", { autoAlpha: 0, y: 30, duration: .35, ease: "power2.in" }, "register")
    .to(plates, { z: 0, x: 0, y: 0, rotation: 0, opacity: 1, duration: .8, stagger: { each: .05, from: "end" } }, "register")
    .to("#stack", { rotationX: 0, rotationZ: 0, scale: 1.32, x: 0, y: 50, duration: .9 }, "register")
    .to(".plate .tab", { autoAlpha: 0, duration: .3 }, "register")
    .to(plates.slice(0, 3).map((pl) => pl.querySelector("svg > g[stroke]")).filter(Boolean), { autoAlpha: 0, duration: .2 }, "register+=.7")
    .addLabel("point", 1.35)
    .fromTo("#me circle", { scale: 4, transformOrigin: "150px 104px", opacity: 0 }, { scale: 1, opacity: 1, duration: .45, ease: "back.out(2)" }, "point")
    .fromTo("#me-label", { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: .4, ease: "power2.out" }, "point+=.2")
    .addLabel("table", 2.0)
    .set("#sheet", { visibility: "visible" }, "table")
    .from("#sheet", { yPercent: 100, duration: .6, ease: "power3.out" }, "table")
    .from("#s-attr tr", { opacity: 0, x: -8, duration: .25, stagger: .05 }, "table+=.35");
  if (reduce) tl.progress(1);
}
</script>
</body>
</html>

<style>body{margin:0;background:#ECEEF0;font-family:"Atkinson Hyperlegible Next",system-ui,sans-serif;width:1240px;color:#1A1D21}
h1{font-size:18px;margin:16px 20px 2px} p.s{margin:0 20px;font-size:13px;color:#555}
main{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:16px 20px}

.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:#fff} .app i{width:44px;height:44px;border-radius:11px;display:block}
.ig{display:flex;gap:16px;align-items:center;padding:0 16px} .av{width:86px;height:86px;border-radius:50%;background:#F2C230;display:grid;place-items:center;flex:none}
.ig b{font-size:16px} .ig small{display:block;font-size:12px;color:#555;margin-top:4px} .ring{width:40px;height:40px;border-radius:50%;padding:2px;border:2px solid #C2410C;display:grid;place-items:center;margin-top:10px} .ring span{width:34px;height:34px;border-radius:50%;background:#F2C230;display:grid;place-items:center}
.tab{width:100%;align-self:start} .strip{background:#DEE1E6;padding:8px 8px 0;display:flex;gap:4px} .t{background:#fff;border-radius:8px 8px 0 0;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:12px;width:150px} .t.off{background:transparent;color:#555} .t.off i{width:16px;height:16px;background:#9AA2AB;border-radius:3px;display:block}
.url{background:#fff;padding:8px 12px;font-size:12px;color:#333;border-bottom:1px solid #ddd} .url span{background:#F1F3F4;border-radius:14px;padding:5px 12px;display:block}
.paper{position:absolute;inset:0;background:#FBFAF6;background-image:repeating-linear-gradient(#FBFAF6 0 23px,#C9D7EA 23px 24px)}
</style>

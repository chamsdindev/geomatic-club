<script>
gsap.registerPlugin(DrawSVGPlugin);
const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });
const K = "b";
if (K === "a") {
  const paths = [...document.querySelectorAll("#mk path")];
  // the raster cells are one path: split it into cells so they can appear in scan order
  const raster = paths[0]; const cells = raster.getAttribute("d").match(/M[^M]+/g); raster.remove();
  const g = document.querySelector("#mk"); const els = cells.map((d) => { const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", d); g.prepend(p); return p; });
  els.sort((a, b) => a.getBBox().y - b.getBBox().y || a.getBBox().x - b.getBBox().x);
  tl.addLabel("raster", 0).from(els, { opacity: 0, duration: .05, stagger: .9 / els.length, ease: "none" }, "raster")
    .addLabel("vector", .95).from(paths.slice(1), { clipPath: "inset(0 100% 0 0)", duration: .55, ease: "power3.inOut", stagger: .08 }, "vector");
}
if (K === "b") {
  tl.addLabel("survey", 0).from("#leg", { drawSVG: 0, duration: 1.3, ease: "none" }, "survey")
    .from(".st", { scale: 0, transformOrigin: "50% 50%", duration: .25, ease: "back.out(3)", stagger: 1.3 / 9 }, "survey")
    .addLabel("known", 1.3).from(".kp", { scale: 0, transformOrigin: "50% 50%", duration: .35, ease: "back.out(2.5)", stagger: .08 }, "known");
}
if (K === "c") {
  const h = document.querySelector("#mk path"); const parts = h.getAttribute("d").match(/M[^M]+/g); h.remove();
  const g = document.querySelector("#mk"); const els = parts.map((d) => { const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", d); g.appendChild(p); return p; });
  tl.addLabel("engrave", 0).from(els, { scaleY: 0, transformOrigin: "50% 100%", opacity: 0, duration: .18, stagger: 1.25 / els.length, ease: "power1.out" }, "engrave");
}
tl.addLabel("name", 1.45).from("#wm", { clipPath: "inset(0 100% 0 0)", duration: .55, ease: "power3.inOut" }, "name");
const q = new URLSearchParams(location.search);
if (q.has("p")) tl.progress(+q.get("p")); else setTimeout(() => tl.play(), 400);

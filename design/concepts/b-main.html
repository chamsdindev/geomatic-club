<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="b-shared.css"><script src="tin.js"></script>
<style>
.peak{position:absolute;left:150px;top:78px;text-align:left}
.peak b{display:block;font-size:15px;font-weight:600;font-variation-settings:"opsz" 18}
.leader{position:absolute;left:150px;top:132px;width:1px;background:var(--blanc);opacity:.8}
.hint{position:absolute;right:16px;top:428px;display:flex;align-items:center;gap:8px;color:var(--calcaire)}
.zscale{position:absolute;right:14px;top:150px;height:200px;width:40px}
.panel{position:absolute;left:0;right:0;top:462px;bottom:0;padding:20px 20px;background:var(--pin)}
h1{font-size:34px;line-height:1;font-weight:750;letter-spacing:-.025em;font-variation-settings:"opsz" 96,"wdth" 85}
.lead{margin-top:6px;color:var(--calcaire);font-size:15px}
.rows{margin-top:14px}
.row{display:grid;grid-template-columns:14px 1fr auto;column-gap:12px;align-items:center;height:52px;border-bottom:1px solid #24423B}
.row label{display:block;color:var(--brume)}
.v{font-size:19px;font-weight:600;font-variation-settings:"opsz" 20}
.alt{color:var(--brume)}
.focus{border-bottom:2px solid var(--blanc)}
.ph{color:#5E7A73}
.cta{margin-top:14px;height:56px;background:var(--jalon);color:var(--pin);display:flex;align-items:center;gap:14px;padding:0 18px;font-weight:750;font-size:19px;font-variation-settings:"wdth" 90}
.cta .rod{height:30px;background:repeating-linear-gradient(180deg,var(--pin) 0 6px,transparent 6px 12px)}
</style></head><body>
<canvas id="c" style="height:470px"></canvas>
<div class="brand"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M16 9.5v13M9.5 16h13" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="2.2" fill="#F25E45"/></svg><span>Geomatic Club</span></div>
<div class="peak"><b>Djebel Boukornine</b><span class="mono">576 m  36.7025 N  10.3518 E</span></div>
<svg class="zscale" viewBox="0 0 40 200" aria-hidden="true"><path d="M34 0v200M28 0h6M30 50h4M30 100h4M30 150h4M28 200h6" stroke="#D8D3C4" stroke-width="1" fill="none"/><text x="24" y="10" fill="#D8D3C4" font-size="11" font-family="Spline Sans Mono" text-anchor="end">576</text><text x="24" y="198" fill="#D8D3C4" font-size="11" font-family="Spline Sans Mono" text-anchor="end">0</text><rect x="32" y="118" width="4" height="82" fill="#F25E45"/></svg>
<div class="hint mono"><svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true"><path d="M2 7c0-3 4-5 9-5s9 2 9 5-4 5-9 5" fill="none" stroke="#D8D3C4" stroke-width="1.4"/><path d="M12 9l-2 3 3 1.5" fill="none" stroke="#D8D3C4" stroke-width="1.4"/></svg>Tourne le relief du doigt</div>
<section class="panel">
 <h1>Réserve ta place.</h1>
 <p class="lead">Indique ton nom et choisis un créneau.</p>
 <div class="rows">
  <div class="row"><span class="rod"></span><div><label class="mono">Prénom</label><div class="v">Amine</div></div><span class="mono alt">J1  148 m</span></div>
  <div class="row"><span class="rod"></span><div><label class="mono">Nom</label><div class="v">Ben Salah</div></div><span class="mono alt">J2  296 m</span></div>
  <div class="row focus"><span class="rod" style="opacity:.3"></span><div><label class="mono">Date</label><div class="v ph">jj/mm/aaaa</div></div><span class="mono alt">J3  431 m</span></div>
  <div class="row"><span class="rod" style="opacity:.3"></span><div><label class="mono">Heure</label><div class="v ph">--:--</div></div><span class="mono alt">J4  576 m</span></div>
 </div>
 <div class="cta"><span class="rod"></span>Envoyer</div>
</section>
<script>
const c=document.getElementById("c"); const P=renderTIN(c,{yaw:0.18,scale:250,hs:118,cy:330,tilt:0.55});
const ctx=c.getContext("2d"); const path=[[0.55,0.75],[0.28,0.5],[0.02,0.22],[-0.2,0.04]];
ctx.setLineDash([3,3]); ctx.strokeStyle="rgba(245,243,236,.7)"; ctx.lineWidth=1; ctx.beginPath(); path.forEach(([x,y],i)=>{const p=P(x,y); i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}); ctx.stroke(); ctx.setLineDash([]);
path.forEach(([x,y],i)=>{const p=P(x,y); jalon(ctx,p.x,p.y,22,i>1)});
const summit=P(-0.2,0.04); const l=document.querySelector(".leader")||document.body.appendChild(Object.assign(document.createElement("div"),{className:"leader"}));
document.querySelector(".peak").style.left=(summit.x-8)+"px"; l.style.left=summit.x+"px"; l.style.top="118px"; l.style.height=Math.max(0,summit.y-118-6)+"px";
</script>
</body></html>

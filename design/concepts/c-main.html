<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="c-shared.css"><script src="skyplot.js"></script>
<style>
.lcd{height:330px;padding:12px 14px}
.status{display:flex;justify-content:space-between;align-items:baseline}
.status .dot{font-size:30px;line-height:1}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.ladder span{height:22px;border:1.5px solid var(--encre);display:flex;align-items:center;justify-content:center;font-size:10.5px}
.ladder .on{background:var(--encre);color:var(--ecran)}
.sky{position:absolute;left:8px;top:84px;width:220px;height:224px}
.vial{position:absolute;right:16px;top:104px;width:100px;text-align:center}
.vial .v{width:96px;height:96px;border-radius:50%;border:2px solid var(--encre);position:relative;margin:0 auto;background:#D3D7B8}
.vial .v:before{content:"";position:absolute;inset:30px;border-radius:50%;border:1.5px solid var(--encre)}
.bubble{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--ecran);border:1.5px solid var(--encre);left:41px;top:28px}
.vial .mono{margin-top:6px;display:block}
.satcount{position:absolute;right:16px;bottom:14px;text-align:right}
.form{padding:14px 14px 0}
.row{margin-bottom:10px}
.row label{display:block;color:var(--grave);font-size:12px;font-weight:500;letter-spacing:.02em;margin:0 0 4px 2px}
.field{height:46px;border-radius:6px;background:var(--ecran);color:var(--encre);display:flex;align-items:center;padding:0 12px;font-weight:600;font-size:18px;border:2px solid #0F1011}
.field.ph{color:#77796C;font-weight:500}
.field.focus{outline:3px solid var(--ambre);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.key{margin:6px 14px 0}
</style></head><body>
<div class="top"><div class="brand"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" fill="none" stroke="currentColor"><path d="M26.4 9.5A12 12 0 1 0 28 16H16" stroke-width="3" stroke-linecap="butt"/><path d="M16 4v24" stroke-width="1.4"/><path d="M12.5 10h7M12.5 22h7" stroke-width="1.4"/></svg><span>Geomatic Club</span></div><span class="screw"></span></div>
<div class="lcd">
 <div class="status"><span class="dot">RTK FLOAT</span><span class="mono">PDOP 1.8</span></div>
 <div class="ladder mono"><span class="on">AUTONOME</span><span class="on">DGPS</span><span class="on">FLOAT</span><span>FIX</span></div>
 <svg class="sky" id="sky"></svg>
 <div class="vial"><div class="v"><div class="bubble"></div></div><span class="mono">Niveau 0,4°</span></div>
 <div class="satcount mono">Satellites<br><span class="dot" style="font-size:26px">09/14</span></div>
</div>
<div class="form">
 <div class="row"><label>Prénom</label><div class="field">Amine</div></div>
 <div class="row"><label>Nom</label><div class="field">Ben Salah</div></div>
 <div class="two"><div class="row"><label>Date</label><div class="field">14.11.2026</div></div><div class="row"><label>Heure</label><div class="field ph focus">--:--</div></div></div>
</div>
<div class="key">Envoyer</div>
<script>skyplot(document.getElementById("sky"), 9)</script>
</body></html>

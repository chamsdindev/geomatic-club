<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 48" role="img" aria-label="Geomatic Club">
  <!-- Geomatic Club wordmark: the triangulation-point symbol of topographic maps, then the name
       in Archivo (width 125, weight 800). Replace this file to change the logo. -->
  <path d="M22 6.5 L39 38 H5 Z" fill="none" stroke="#13233B" stroke-width="3.2" stroke-linejoin="miter"/>
  <circle cx="22" cy="27.4" r="3.6" fill="#13233B"/>
  <text x="54" y="37" fill="#13233B" font-family="Archivo, 'Archivo Expanded', system-ui, sans-serif" font-size="38" font-weight="800" font-stretch="125%" letter-spacing="-1.3" style="font-variation-settings:'wdth' 125">Geomatic Club</text>
</svg>
